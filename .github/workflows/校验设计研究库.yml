name: 校验设计研究库
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '设计研究库/**'
      - 'readme.md'
      - 'AGENTS.md'
      - '.github/workflows/校验设计研究库.yml'
  pull_request:
    paths:
      - '设计研究库/**'
      - 'readme.md'
      - 'AGENTS.md'
      - '.github/workflows/校验设计研究库.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML>=6,<7'
      - name: 检查元信息、索引与本地链接
        run: python 设计研究库/08_研究模板与索引/脚本/维护研究索引.py --check
